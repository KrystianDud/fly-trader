<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>News Pipeline Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  :root {
    --night: #171320;
    --panel: #201A2A;
    --edge: rgba(255, 190, 122, 0.12);
    --cream: #F5EBE0;
    --dim: #B5A5A8;
    --faint: #7C6C75;
    --lamp: #FFBE7A;
    --mint: #6FD3C2;
    --coral: #FF6B5A;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --sans: "DM Sans", system-ui, sans-serif;
  }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--night); color: var(--cream);
    font-family: var(--sans); display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: baseline; gap: 18px; flex-wrap: wrap;
    padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px 14px;
    border-bottom: 1px solid var(--edge);
  }
  h1 {
    margin: 0; font-family: var(--mono); font-size: 14px; font-weight: 700;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--lamp);
  }
  .live { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); }
  .dot.on { background: var(--mint); box-shadow: 0 0 9px var(--mint); animation: p 2.4s ease-in-out infinite; }
  @keyframes p { 0%,100% { opacity: .4 } 50% { opacity: 1 } }
  .counts { margin-left: auto; display: flex; gap: 20px; font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .counts b { color: var(--cream); font-weight: 500; }

  main {
    flex: 1; display: grid; grid-template-columns: 1fr 1fr 1.15fr;
    gap: 1px; background: var(--edge); min-height: 0;
  }
  section { background: var(--night); display: flex; flex-direction: column; min-height: 0; }
  h2 {
    margin: 0; padding: 12px 16px 10px;
    font-family: var(--mono); font-size: 10.5px; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase; color: var(--mint);
    border-bottom: 1px solid var(--edge);
    display: flex; justify-content: space-between; gap: 10px;
  }
  h2 em { font-style: normal; color: var(--faint); letter-spacing: 0.06em; }
  .feed { overflow-y: auto; padding: 4px 0 20px; }
  .feed::-webkit-scrollbar { width: 6px; }
  .feed::-webkit-scrollbar-thumb { background: rgba(255,190,122,0.2); border-radius: 3px; }

  article {
    padding: 9px 16px; border-bottom: 1px solid rgba(255,190,122,0.05);
    animation: in .35s ease both;
  }
  @keyframes in { from { opacity: 0; transform: translateY(-5px) } to { opacity: 1; transform: none } }
  .meta {
    display: flex; gap: 10px; align-items: baseline;
    font-family: var(--mono); font-size: 9.5px; color: var(--faint); margin-bottom: 4px;
  }
  .headline { font-size: 12.5px; line-height: 1.45; margin: 0; }
  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; font-family: var(--mono); font-size: 10px; color: var(--dim); }
  .tags i { font-style: normal; }
  .up { color: var(--mint); }
  .down { color: var(--coral); }
  .warn { color: var(--lamp); }

  .score {
    font-family: var(--mono); font-size: 10px; padding: 1px 6px;
    border: 1px solid var(--edge); border-radius: 6px; color: var(--dim);
  }
  .score.hot { color: var(--lamp); border-color: rgba(255,190,122,0.45); }
  .bar { height: 3px; background: rgba(255,190,122,0.12); border-radius: 2px; margin-top: 7px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--lamp); }
  .empty { padding: 18px 16px; font-size: 12px; color: var(--faint); }
  .slice-head {
    position: sticky; top: 0; z-index: 2;
    display: flex; justify-content: space-between;
    padding: 6px 16px;
    background: linear-gradient(to bottom, var(--night) 70%, rgba(23,19,32,0.85));
    border-bottom: 1px solid var(--edge);
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--lamp);
  }
  .slice-head span:last-child { color: var(--faint); }
  #status b { color: var(--cream); font-weight: 500; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>News pipeline</h1>
  <span class="live"><span class="dot" id="dot"></span><span id="status">connecting…</span></span>
  <span class="counts">
    <span>ingested <b id="c-in">0</b></span>
    <span>forwarded <b id="c-tri">0</b></span>
    <span>scored <b id="c-sc">0</b></span>
  </span>
</header>

<main>
  <section>
    <h2>1 · Ingested <em>GDELT, filtered</em></h2>
    <div class="feed" id="feed-in"><p class="empty">Waiting for the next 15-minute slice…</p></div>
  </section>
  <section>
    <h2>2 · Triaged <em>local classifier</em></h2>
    <div class="feed" id="feed-tri"><p class="empty">Top 6 per slice by predicted market impact.</p></div>
  </section>
  <section>
    <h2>3 · Scored <em>Jev</em></h2>
    <div class="feed" id="feed-sc"><p class="empty">Only what survives triage gets an LLM call.</p></div>
  </section>
</main>

<script>
(function () {
  "use strict";
  const feeds = {
    in: document.getElementById("feed-in"),
    tri: document.getElementById("feed-tri"),
    sc: document.getElementById("feed-sc"),
  };
  const MAX = 120;

  function clearEmpty(el) {
    const e = el.querySelector(".empty");
    if (e) e.remove();
  }
  function trim(el) {
    while (el.children.length > MAX) el.removeChild(el.lastChild);
  }
  function fmt(iso) { return new Date(iso).toISOString().slice(11, 16) + "Z"; }

  function ago(ms) {
    const s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + "s";
    const m = Math.floor(s / 60);
    return m < 60 ? m + "m " + (s % 60) + "s" : Math.floor(m / 60) + "h " + (m % 60) + "m";
  }

  // a slice header, so a batch arriving is visible as a batch
  function divider(el, iso, label) {
    const prev = el.firstChild;
    if (prev && prev.classList && prev.classList.contains("slice-head") &&
        prev.dataset.t === iso) return;
    const d = document.createElement("div");
    d.className = "slice-head";
    d.dataset.t = iso;
    d.innerHTML = "<span>" + fmt(iso) + "</span><span>" + label + "</span>";
    el.prepend(d);
  }

  function addArticle(d) {
    const hot = d.triage != null && d.triage >= 0.5;
    const el = document.createElement("article");
    el.innerHTML =
      '<div class="meta"><span>' + fmt(d.t) + "</span><span>" + d.source + "</span>" +
      (d.triage != null ? '<span class="score' + (hot ? " hot" : "") + '">' + d.triage.toFixed(3) + "</span>" : "") +
      "</div><p class=\"headline\">" + d.headline + "</p>" +
      '<div class="bar"><span style="width:' + Math.round((d.triage ?? 0) * 100) + '%"></span></div>';
    feeds.in.prepend(el);
    trim(feeds.in);
    clearEmpty(feeds.in);
  }

  function addForwarded(d) {
    const el = document.createElement("article");
    el.innerHTML =
      '<div class="meta"><span>' + fmt(d.t) + "</span><span>" + d.source + "</span>" +
      (d.triage != null ? '<span class="score hot">' + d.triage.toFixed(3) + "</span>" : "") +
      "</div><p class=\"headline\">" + d.headline + "</p>" +
      '<div class="bar"><span style="width:' + Math.round((d.triage ?? 0) * 100) + '%"></span></div>';
    feeds.tri.prepend(el);
    trim(feeds.tri);
    clearEmpty(feeds.tri);
  }

  function addScored(d) {
    const dir = d.yen > 2.3 ? "up" : d.yen < 1.7 ? "down" : "";
    const el = document.createElement("article");
    el.innerHTML =
      '<div class="meta"><span>' + fmt(d.t) + "</span>" +
      (d.triage != null ? '<span class="score hot">' + d.triage.toFixed(3) + "</span>" : "") +
      "</div><p class=\"headline\">" + d.headline + "</p>" +
      '<div class="tags">' +
      '<span>yen <i class="' + dir + '">' + d.yen.toFixed(2) + "</i>/4</span>" +
      "<span>conf " + d.conf.toFixed(2) + "</span>" +
      '<span>shock <i class="' + (d.shock > 0.6 ? "warn" : "") + '">' + d.shock.toFixed(2) + "</i></span>" +
      "<span>" + d.kind + "</span>" +
      "<span>lexicon " + d.tone.toFixed(1) + "</span>" +
      "</div>";
    feeds.sc.prepend(el);
    trim(feeds.sc);
    clearEmpty(feeds.sc);
  }

  const clock = { last: null, seen: null };

  function tick() {
    const status = document.getElementById("status");
    if (!clock.last) return;
    const next = new Date(clock.last.getTime() + 15 * 60000);
    const until = next.getTime() + 4 * 60000 - Date.now();  // GDELT posts a few minutes late
    status.innerHTML =
      "live · last slice <b>" + fmt(clock.last.toISOString()) + "</b> (" +
      ago(Date.now() - clock.seen) + " ago) · next " +
      (until > 0 ? "in " + ago(until) : "any moment");
  }
  setInterval(tick, 1000);

  function connect() {
    const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    const dot = document.getElementById("dot");
    const status = document.getElementById("status");

    ws.onopen = function () {
      dot.classList.add("on");
      status.textContent = "live";
    };
    ws.onclose = function () {
      dot.classList.remove("on");
      status.textContent = "reconnecting…";
      setTimeout(connect, 3000);
    };
    ws.onmessage = function (ev) {
      const d = JSON.parse(ev.data);
      if (d.type === "article") addArticle(d);
      else if (d.type === "forwarded") addForwarded(d);
      else if (d.type === "scored") addScored(d);
      else if (d.type === "counts") {
        document.getElementById("c-in").textContent = d.ingested;
        document.getElementById("c-tri").textContent = d.triaged;
        document.getElementById("c-sc").textContent = d.scored;
      } else if (d.type === "slice") {
        if (d.stage === "fetching") {
          divider(feeds.in, d.t, "slice");
          divider(feeds.tri, d.t, "forwarded");
          divider(feeds.sc, d.t, "scored");
        }
        status.textContent = d.stage === "fetching" ? "fetching " + fmt(d.t) : d.stage;
      } else if (d.type === "waiting") {
        clock.last = new Date(d.next_after);
        clock.seen = Date.now();
        tick();
      } else if (d.type === "error") {
        status.textContent = "error: " + d.message;
      }
    };
  }
  connect();
})();
</script>
</body>
</html>
